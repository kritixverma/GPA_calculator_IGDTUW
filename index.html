<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IGDTUW GPA Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>IGDTUW GPA Calculator</h1>
    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>Subject</th>
            <th>Marks</th>
            <th>Credits</th>
            <th>Grade Point</th>
            <th>Grade</th>
          </tr>
        </thead>
        <tbody id="subjects">
          <tr>
            <td>Subject 1</td>
            <td><input type="number" class="marks" min="0" max="100"></td>
            <td><input type="number" class="credits" min="1" max="5"></td>
            <td class="grade-point"></td>
            <td class="grade"></td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="actions">
      <div class="subject-control">
        <button class="icon-button" onclick="removeLastRow()">-</button>
        <span>Subject</span>
        <button class="icon-button" onclick="addRow()">+</button>
      </div>
      <button class="calculate-button" onclick="calculateGPA()">Calculate</button>
    </div>
    <div class="result" id="result"></div>
  </div> 
  <div class="grade-box">
<table class="main-table">
  <tr>
    <th>Marks</th>
    <th>Grade</th>
    <th>Grade Point</th>
  </tr>
  <tr><td>93 - 100</td><td>A+</td><td>10</td></tr>
  <tr><td>85 - 92</td><td>A</td><td>9</td></tr>
  <tr><td>77 - 84</td><td>B+</td><td>8</td></tr>
  <tr><td>69 - 76</td><td>B</td><td>7</td></tr>
  <tr><td>61 - 68</td><td>C+</td><td>6</td></tr>
  <tr><td>53 - 60</td><td>C</td><td>5</td></tr>
  <tr><td>45 - 52</td><td>D</td><td>4</td></tr>
  <tr><td>Below 45</td><td>F</td><td>0</td></tr>
</table>
      </div> 
  <script src="script.js"></script>
</body>
</html>
